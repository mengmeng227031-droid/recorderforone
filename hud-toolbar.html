<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>录制工具栏</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI",system-ui,sans-serif;color:#f2f5ee}
#toolbar{display:flex;align-items:center;gap:6px;width:max-content;margin:12px auto 0;padding:7px 10px;border:1px solid rgba(185,244,100,.35);border-radius:14px;background:rgba(14,18,12,.94);box-shadow:0 8px 30px rgba(0,0,0,.35);user-select:none}
.group{display:flex;align-items:center;gap:5px;padding:0 3px;border-right:1px solid rgba(255,255,255,.14)}
.group:last-child{border-right:0}
button{border:0;border-radius:8px;background:rgba(255,255,255,.09);color:#fff;min-width:32px;height:31px;padding:0 9px;cursor:pointer;font-size:13px}
button:hover{background:rgba(185,244,100,.25)}
button.active{background:#b9f464;color:#0b0d0a}
button.stop{background:#ef4444;color:#fff;font-weight:700}
button.small{min-width:28px;padding:0 6px;font-size:16px}
#state{font-size:12px;color:#b9f464;min-width:54px;text-align:center}
</style>
</head>
<body>
  <div id="toolbar">
    <div class="group"><span id="state">● 录制中</span><button class="small" data-action="pause" title="暂停录制">Ⅱ</button><button class="stop" data-action="stop" title="停止录制">■ 停止</button></div>
    <div class="group"><button data-action="pointer" title="恢复鼠标操作">🖱</button><button data-action="tool" data-tool="laser" title="激光笔">🔴</button><button data-action="tool" data-tool="pen" title="画笔">✏️</button><button data-action="tool" data-tool="hl" title="荧光笔">🖍️</button><button data-action="tool" data-tool="arrow" title="箭头">↗</button><button data-action="tool" data-tool="rect" title="矩形">▭</button></div>
    <div class="group"><button class="small" data-action="undo" title="撤销">↶</button><button class="small" data-action="clear" title="清除涂鸦">🗑️</button><button data-action="screenshot" title="截图">📸</button><button data-action="hide" title="隐藏工具栏">隐藏</button></div>
  </div>
<script>
'use strict';
const api = window.hudAPI;
const toolbar = document.getElementById('toolbar');
const stateEl = document.getElementById('state');
const pauseBtn = toolbar.querySelector('[data-action="pause"]');
let isPaused = false;

function setPaused(value){
  isPaused = !!value;
  pauseBtn.textContent = isPaused ? '▶' : 'Ⅱ';
  pauseBtn.title = isPaused ? '继续录制' : '暂停录制';
  stateEl.textContent = isPaused ? '⏸ 已暂停' : '● 录制中';
}
function setToolActive(tool){
  toolbar.querySelectorAll('[data-action="tool"]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
}
api.onState(state => { setPaused(state && state.paused); setToolActive(state && state.tool || null); });
api.onAction(action => {
  if(action && action.type === 'tool') setToolActive(action.tool || null);
});
document.querySelectorAll('button[data-action]').forEach(button => {
  button.addEventListener('click', () => {
    const action = button.dataset.action;
    if(action === 'hide'){ api.toolbar('hide'); return; }
    if(action === 'tool'){
      const tool = button.dataset.tool;
      const nextTool = button.classList.contains('active') ? null : tool;
      setToolActive(nextTool);
      api.action({type:'tool', tool:nextTool});
      return;
    }
    if(action === 'pointer'){
      setToolActive(null);
      api.action({type:'tool', tool:null});
      return;
    }
    if(action === 'pause') setPaused(!isPaused);
    api.action({type:action});
  });
});
</script>
</body>
</html>
